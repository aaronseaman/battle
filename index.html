<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Reef Rumble</title>
  <meta name="description" content="Swipe your glossy fish school through the reef: pick gates, crack clams, beat the boss.">
  <meta name="theme-color" content="#087cce">
  <meta name="color-scheme" content="only light">
  <meta name="format-detection" content="telephone=no, date=no, email=no, address=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reef Rumble">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- iOS launch screens (iOS ignores the manifest for these) -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1206x2622.png"><!-- iPhone 17 / 17 Pro -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1320x2868.png"><!-- iPhone 17 Pro Max -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1260x2736.png"><!-- iPhone Air -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1179x2556.png"><!-- iPhone 16 / 15 -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1290x2796.png"><!-- iPhone 16 Plus / 15 Pro Max -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1170x2532.png"><!-- iPhone 16e / 14 -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="modulepreload" href="src/main.js">
</head>
<body>
  <div id="app">
    <canvas id="game" aria-label="Reef Rumble play field"></canvas>

    <div id="hud">
      <div class="hud-top">
        <div class="chip" id="hud-level">Level 1</div>
        <div class="progress" aria-label="Level progress"><div class="fill" id="hud-progress"></div><span class="goal"><svg viewBox="0 0 48 42" aria-hidden="true"><defs><linearGradient id="crown-gold" x2="0" y2="1"><stop stop-color="#fffaa4"/><stop offset=".5" stop-color="#ffd52d"/><stop offset="1" stop-color="#ef9a04"/></linearGradient></defs><path d="M6 12 14 23 24 5 34 23 42 12 38 34H10Z" fill="url(#crown-gold)" stroke="#e69511" stroke-width="2"/><path d="M11 34h26v5H11Z" fill="#ffe16b" stroke="#e69511"/><g fill="#fff3a0" stroke="#edac16"><circle cx="6" cy="10" r="3"/><circle cx="24" cy="4" r="3"/><circle cx="42" cy="10" r="3"/></g></svg></span></div>
        <div class="chip coins" id="hud-coins">0</div>
        <button type="button" tabindex="-1" class="chip btn" id="hud-pause" data-tap="pause" aria-label="Pause">❚❚</button>
      </div>
      <div id="hint"><span class="hand" aria-hidden="true">↔</span> Swipe left / right to steer</div>
    </div>

    <div id="panel" class="hidden"></div>
    <div id="banner"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="debug" hidden></div>
    <div id="rotate" aria-live="polite"><div class="phone" aria-hidden="true"></div><p>Turn your phone upright to play</p></div>
    <noscript><p class="noscript">Reef Rumble needs JavaScript.</p></noscript>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
